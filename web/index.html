<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Periferia · Agente Órdenes de Compra SAP</title>
    <style>
      :root {
        --bg: #070b16;
        --bg2: #0d1424;
        --panel: #0f1830;
        --panel2: #141f3a;
        --border: #22304f;
        --text: #e6ecf7;
        --muted: #8b9bb7;
        --brand: #34e0a1;
        --brand2: #22d3ee;
        --brand-soft: rgba(52, 224, 161, 0.12);
        --user: #1f6feb;
        --tool: #22d3ee;
        --confirm: #f59e0b;
        --confirm-bg: rgba(245, 158, 11, 0.12);
        --err: #f87171;
        --err-bg: rgba(248, 113, 113, 0.12);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background:
          radial-gradient(900px 500px at 90% -10%, rgba(34, 211, 238, 0.12), transparent 60%),
          radial-gradient(800px 500px at -10% 110%, rgba(52, 224, 161, 0.12), transparent 55%),
          var(--bg);
        display: flex; align-items: center; justify-content: center; padding: 24px;
      }
      .app {
        width: 100%; max-width: 900px; height: min(90vh, 860px);
        background: linear-gradient(180deg, var(--panel), var(--bg2));
        border: 1px solid var(--border); border-radius: 20px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        display: flex; flex-direction: column; overflow: hidden;
      }
      header {
        display: flex; align-items: center; gap: 14px; padding: 16px 22px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
      }
      .brand-logo { height: 30px; width: auto; }
      .sep { width: 1px; height: 26px; background: var(--border); }
      .titles { flex: 1; min-width: 0; }
      .titles h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: 0.1px; }
      .titles p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
      .status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #475569; }
      .dot.on { background: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }

      #historial { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
      .row { display: flex; gap: 10px; max-width: 84%; }
      .row.user { align-self: flex-end; flex-direction: row-reverse; }
      .avatar { width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #04121a; }
      .avatar.a { background: linear-gradient(135deg, var(--brand), var(--brand2)); }
      .avatar.u { background: #1f6feb; color: #fff; }
      .bubble { padding: 11px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; border: 1px solid var(--border); background: var(--panel2); }
      .row.user .bubble { background: var(--user); color: #fff; border-color: transparent; border-bottom-right-radius: 4px; }
      .row.assistant .bubble { border-bottom-left-radius: 4px; }
      .bubble :first-child { margin-top: 0; } .bubble :last-child { margin-bottom: 0; }
      .bubble h1, .bubble h2, .bubble h3 { font-size: 14.5px; margin: 10px 0 6px; }
      .bubble p { margin: 6px 0; } .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }
      .bubble code { background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
      .bubble pre { background: #0a1122; border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px; overflow-x: auto; }
      .bubble pre code { background: none; padding: 0; }
      .bubble a { color: var(--brand2); }

      .tools { align-self: flex-start; width: 100%; max-width: 84%; margin-left: 40px; margin-top: -6px; display: flex; flex-direction: column; gap: 6px; }
      .tools-label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
      details.tool { background: var(--panel2); border: 1px solid var(--border); border-left: 3px solid var(--tool); border-radius: 10px; overflow: hidden; }
      details.tool summary { cursor: pointer; padding: 9px 12px; list-style: none; display: flex; align-items: center; gap: 9px; font-size: 13px; }
      details.tool summary::-webkit-details-marker { display: none; }
      .caret { color: var(--muted); transition: transform 0.15s; font-size: 11px; }
      details.tool[open] .caret { transform: rotate(90deg); }
      .tool-name { font-family: ui-monospace, Menlo, monospace; font-weight: 600; color: var(--brand); }
      .tool .hint { margin-left: auto; font-size: 11px; color: var(--muted); }
      details.tool pre { margin: 0; padding: 0 12px 12px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--muted); }

      .confirm { align-self: center; width: 100%; max-width: 84%; background: var(--confirm-bg); border: 1px solid rgba(245,158,11,0.4); border-left: 3px solid var(--confirm); color: #fcd34d; padding: 10px 14px; border-radius: 10px; font-size: 13.5px; }
      .error { align-self: center; width: 100%; max-width: 84%; background: var(--err-bg); border: 1px solid rgba(248,113,113,0.4); border-left: 3px solid var(--err); color: #fca5a5; padding: 10px 14px; border-radius: 10px; font-size: 13.5px; }

      .typing { display: inline-flex; gap: 4px; padding: 12px 14px; }
      .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
      .typing span:nth-child(2) { animation-delay: 0.2s; } .typing span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }

      .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 22px 12px; }
      .suggestions button { border: 1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--muted); padding: 6px 12px; border-radius: 999px; font-size: 12.5px; cursor: pointer; transition: 0.15s; }
      .suggestions button:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

      footer { padding: 14px 18px; border-top: 1px solid var(--border); background: rgba(255,255,255,0.02); }
      form { display: flex; gap: 10px; align-items: flex-end; }
      textarea { flex: 1; resize: none; min-height: 46px; max-height: 140px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg2); color: var(--text); font-family: inherit; font-size: 14px; line-height: 1.4; outline: none; transition: 0.15s; }
      textarea::placeholder { color: #5b6b86; }
      textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
      .send { height: 46px; padding: 0 22px; border: none; border-radius: 12px; cursor: pointer; background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #04121a; font-weight: 700; font-size: 14px; transition: 0.15s; }
      .send:hover { filter: brightness(1.08); } .send:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <img class="brand-logo" src="https://periferiaitgroup.com/assets/img/periferia-it-group-1.webp" alt="Periferia IT Group"
             onerror="this.style.display='none'" />
        <div class="sep"></div>
        <div class="titles">
          <h1>Agente · Órdenes de Compra SAP</h1>
          <p>Tecnología que mueve negocio · humano en el bucle</p>
        </div>
        <div class="status"><span class="dot" id="dot"></span><span id="statusText">conectando…</span></div>
      </header>

      <div id="historial"></div>

      <div class="suggestions" id="suggestions">
        <button data-q="Procesa la solicitud sol-001">Procesa sol-001</button>
        <button data-q="Procesa la solicitud sol-003">sol-003 (bloqueada)</button>
        <button data-q="Procesa la solicitud sol-004">sol-004 (confirmar)</button>
        <button data-q="Procesa la solicitud sol-005">sol-005 (retroactiva)</button>
      </div>

      <footer>
        <form id="form">
          <textarea id="msg" placeholder="Escribe una instrucción… (ej: procesa la solicitud sol-001)" autocomplete="off" rows="1"></textarea>
          <button class="send" id="send" type="submit">Enviar</button>
        </form>
      </footer>
    </div>

    <script>
      const sessionId = "web-" + Math.random().toString(36).slice(2);
      const historial = document.getElementById("historial");
      const form = document.getElementById("form");
      const input = document.getElementById("msg");
      const sendBtn = document.getElementById("send");

      fetch("/api/health").then((r) => r.json()).then((h) => {
        document.getElementById("dot").classList.add("on");
        document.getElementById("statusText").textContent = (h.provider || "?") + " · " + (h.model || "?");
      }).catch(() => { document.getElementById("statusText").textContent = "sin conexión"; });

      function el(tag, cls, html) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (html != null) n.innerHTML = html;
        return n;
      }
      function scroll() { historial.scrollTop = historial.scrollHeight; }
      function escapar(s) { return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

      // Render Markdown minimalista y seguro (escapa HTML antes de aplicar formato).
      function md(src) {
        const bloques = [];
        let s = escapar(src);
        s = s.replace(/```([\s\S]*?)```/g, (_, c) => { bloques.push(c); return "\u0000" + (bloques.length - 1) + "\u0000"; });
        const lineas = s.split("\n");
        let html = "", lista = null;
        const inline = (t) => t
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
          .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        const cerrarLista = () => { if (lista) { html += "</" + lista + ">"; lista = null; } };
        for (const linea of lineas) {
          const l = linea.trim();
          const ph = l.match(/^\u0000(\d+)\u0000$/);
          if (ph) { cerrarLista(); html += "<pre><code>" + bloques[Number(ph[1])] + "</code></pre>"; continue; }
          if (!l) { cerrarLista(); continue; }
          const h = l.match(/^(#{1,3})\s+(.*)$/);
          if (h) { cerrarLista(); const n = h[1].length; html += "<h" + n + ">" + inline(h[2]) + "</h" + n + ">"; continue; }
          const ol = l.match(/^\d+\.\s+(.*)$/);
          const ul = l.match(/^[-*]\s+(.*)$/);
          if (ol) { if (lista !== "ol") { cerrarLista(); lista = "ol"; html += "<ol>"; } html += "<li>" + inline(ol[1]) + "</li>"; continue; }
          if (ul) { if (lista !== "ul") { cerrarLista(); lista = "ul"; html += "<ul>"; } html += "<li>" + inline(ul[1]) + "</li>"; continue; }
          cerrarLista(); html += "<p>" + inline(l) + "</p>";
        }
        cerrarLista();
        return html;
      }

      function mensajeUsuario(texto) {
        const row = el("div", "row user");
        row.appendChild(el("div", "avatar u", "Tú"));
        row.appendChild(el("div", "bubble", escapar(texto)));
        historial.appendChild(row); scroll();
      }
      function mensajeAgente(texto) {
        const row = el("div", "row assistant");
        row.appendChild(el("div", "avatar a", "IA"));
        row.appendChild(el("div", "bubble", md(texto)));
        historial.appendChild(row); scroll();
      }
      function toolCalls(lista) {
        if (!lista || !lista.length) return;
        const cont = el("div", "tools");
        cont.appendChild(el("div", "tools-label", "Herramientas usadas (" + lista.length + ")"));
        for (const tc of lista) {
          const d = el("details", "tool");
          d.appendChild(el("summary", null,
            '<span class="caret">▶</span><span class="tool-name">' + escapar(tc.name) + "</span>" +
            '<span class="hint">clic para ver detalle</span>'));
          d.appendChild(el("pre", null, "args: " + escapar(tc.arguments) + "\n\n→ " + escapar(tc.resultado)));
          cont.appendChild(d);
        }
        historial.appendChild(cont); scroll();
      }
      function aviso(clase, texto) { historial.appendChild(el("div", clase, escapar(texto))); scroll(); }

      async function enviar(message) {
        if (!message) return;
        mensajeUsuario(message);
        input.value = ""; autosize(); sendBtn.disabled = true;

        const typing = el("div", "row assistant");
        typing.appendChild(el("div", "avatar a", "IA"));
        const t = el("div", "bubble"); t.appendChild(el("div", "typing", "<span></span><span></span><span></span>"));
        typing.appendChild(t); historial.appendChild(typing); scroll();

        try {
          const r = await fetch("/api/chat", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId, message }),
          });
          const data = await r.json();
          typing.remove();
          if (!data.ok) { aviso("error", "Error: " + data.error); return; }
          mensajeAgente(data.reply);
          toolCalls(data.toolCalls);
          if (data.needsConfirmation) aviso("confirm", "⚠️ El agente espera tu confirmación. Responde para continuar.");
        } catch (err) {
          typing.remove(); aviso("error", "Error de red: " + String(err));
        } finally {
          sendBtn.disabled = false; input.focus();
        }
      }

      form.addEventListener("submit", (e) => { e.preventDefault(); enviar(input.value.trim()); });
      input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(input.value.trim()); } });
      document.getElementById("suggestions").addEventListener("click", (e) => { const q = e.target.getAttribute("data-q"); if (q) enviar(q); });
      function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
      input.addEventListener("input", autosize);
    </script>
  </body>
</html>
